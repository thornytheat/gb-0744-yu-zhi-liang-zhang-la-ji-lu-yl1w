services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-18433}:8000"
    environment:
      STRETCH_DB: /state/stretch.sqlite3
    volumes:
      - stretch-data:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  stretch-data:
